root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/main"
  # `irgo assets` regenerates templ and the stylesheet using whichever package
  # runner the project has (bun or npm). Spelling the pipeline out again here
  # meant it drifted: this hardcoded npx while the project uses bun.
  cmd = "irgo assets && go build -o ./tmp/main ."
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "node_modules", "ios", "android", "build"]
  exclude_file = []
  exclude_regex = ["_test.go", "_templ.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = []
  include_ext = ["go", "templ", "html", "css"]
  kill_delay = "0s"
  log = "build-errors.log"
  send_interrupt = false
  stop_on_error = true
  args_bin = ["serve"]

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  time = false

[misc]
  clean_on_exit = true
