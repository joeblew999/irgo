# Browser tests, on every desktop ecosystem.
#
# The interesting failures in an irgo app all render correct HTML: a component
# that never upgraded, a stylesheet that 404s, a signal that never updated.
# No handler-level test can see any of them, because they happen after the
# response. So they need a browser, and a browser needs somewhere to run.
#
# Matrixed across three operating systems because that is where the differences
# live. A module script rejected for its MIME type, a font that resolves on one
# platform and not another — those do not show up on the author's laptop.

name: browser

on:
  push:
    # integration is where this fork's work actually lands; main only
    # mirrors upstream and never receives a commit. Without it here, nothing
    # this fork writes was ever tested by CI on push.
    branches: [integration]
  pull_request:

# Without this, superseded runs keep going. ci.yml has had it from the start;
# this file never did, so pushing twice to a branch left the first run's three
# jobs occupying runners for work nobody was waiting on any more. Two were
# found still running against commits that had been replaced half an hour
# earlier, while the run that mattered queued behind them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: ${{ matrix.example }} on ${{ matrix.os }}

    # A hang here is not hypothetical. `playwright install --with-deps chromium`
    # stalls on ubuntu-latest often enough that in one afternoon it succeeded
    # once in four attempts, and a step with no limit inherits GitHub's default
    # of six hours. That is six hours of a held runner, and — because the trunk
    # requires this check — six hours in which no pull request can merge, from
    # a job that was never going to finish.
    #
    # Fifteen minutes is roughly three times the slowest healthy run: when the
    # install works, ubuntu takes 2m33s, macOS 49s, and Windows 5m21s, which is
    # the real ceiling. So this cannot fire on a merely slow run; it fires on a
    # stuck one, and turns "blocked indefinitely" into a red check you can
    # re-run.
    #
    # It treats the symptom on purpose. Why apt stalls inside that installer is
    # worth knowing, but not at the cost of leaving merges blocked until it is.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The examples are separate Go modules, so `go test ./...` at the
        # repository root does not reach them. Each is entered explicitly.
        example: [morpheus]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # The EXAMPLE's go.mod, not the repository root's. These examples
          # depend on github.com/romshark/morpheus, which requires Go 1.26.5,
          # while irgo requires 1.25.0 on purpose — demanding a newer Go of
          # every irgo user was tried once and backed out. Resolving from the
          # root here installed 1.25.0 and the module would not build.
          go-version-file: examples/${{ matrix.example }}/go.mod
          cache: true

      # --with-deps installs the system libraries a browser needs on Linux
      # runners, which have none of them. It is a no-op elsewhere.
      #
      # Only chromium: firefox and webkit are worth installing when there is
      # something to learn from them, and each is another few hundred megabytes
      # on every job in the matrix.
      - name: Install the browser
        working-directory: examples/${{ matrix.example }}
        run: go run github.com/mxschmitt/playwright-go/cmd/playwright@v0.6100.0 install --with-deps chromium

      # `project test`, not `go test`. A fresh checkout has none of the
      # generated assets — *_templ.go, the Tailwind output, and a UI kit's
      # stylesheets are all gitignored — so `go test` first fails to compile,
      # and then, once templates exist, serves 404s for the kit CSS. The
      # browser reports that as a MIME error, which reads like a server bug and
      # is not one.
      #
      # `project test` is the pipeline that produces all of it, in order, and
      # is what ci.yml already uses to reach these same examples.
      - name: Test
        run: go run ./cmd/irgo -C examples/${{ matrix.example }} project test
