# Deploy the documentation site to Cloudflare Workers.
#
# It used to go out by hand from a laptop, which meant the published docs were
# whoever's working copy ran wrangler last.

name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs-templ/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  # The docs site: a Go + templ irgo app, deployed as irgo-dev. It replaced a
  # TSX site that ran alongside it until it had ported everything.
  deploy:
    name: Deploy the docs site
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check for credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set — building only"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      # app deploy builds, and building regenerates the assets — there is
      # nothing to sequence by hand.
      - name: Deploy
        if: steps.creds.outputs.deploy == 'true'
        run: go run ./cmd/irgo -C docs-templ app deploy cloudflare
      # Still build when there are no credentials, so a broken site is caught
      # whether or not this repository can deploy it.
      - name: Build only
        if: steps.creds.outputs.deploy != 'true'
        run: go run ./cmd/irgo -C docs-templ app build cloudflare
