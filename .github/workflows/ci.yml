# The framework's own tests, and proof that the CLI still produces a project
# that builds.
#
# This repository had no CI at all while the demo it generates had eight jobs,
# so every check ran against the output and none against the thing producing it.

name: ci

on:
  push:
    # integration is where this fork's work actually lands; main only
    # mirrors upstream and never receives a commit. Without it here, nothing
    # this fork writes was ever tested by CI on push.
    branches: [main, integration]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Formatting is checked rather than assumed: three files had been
      # unformatted since the Datastar migration, which nothing surfaced.
      # Formatting is asserted by TestEverythingIsFormatted, so `go test ./...`
      # covers it and `mise run check` predicts this job instead of being a
      # weaker version of it.
      - run: go vet ./...
      # The Cloudflare target compiles the framework for GOOS=js GOARCH=wasm,
      # where a different set of files is selected. Building it here is what
      # catches a file that silently left one platform's build — a stronger
      # check than any naming rule, since it fails on the symptom.
      - run: GOOS=js GOARCH=wasm go build ./...
      # This includes TestScaffoldedProjectBuilds, which generates a project
      # from this checkout and compiles it. It is a test rather than steps in
      # this file so it runs the same way on a laptop as it does here.
      - run: go test ./...
      # pkg/browsertest is its own module, so the line above does not reach it.
      # A nested module that nothing builds is a nested module that rots.
      - run: go build ./...
        working-directory: pkg/browsertest

  docs-templ:
    name: Docs site (templ) builds and matches the CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # `go run ./cmd/irgo` rather than `go tool irgo`: the tool directive
      # lives in a consuming project's go.mod, not the framework's, so there is
      # no `go tool irgo` at this root. Running the checkout's own CLI is also
      # what should be tested here — the commit's behaviour, not a pinned
      # release's.
      #
      # No separate asset step: project test and app build both regenerate what
      # they need. A pipeline that has to remember the order is a pipeline that
      # will one day forget.
      # Its CLI reference is generated from this checkout's own declarations, so
      # a command renamed here and not regenerated there fails as a test rather
      # than shipping a page describing a command that no longer exists.
      - run: go run ./cmd/irgo -C docs-templ project test
      - run: go run ./cmd/irgo -C docs-templ app build cloudflare

  example:
    name: The todo example still runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # A worked example that cannot be run is worse than none: this one was
      # loose files inside the framework's module, so `app build desktop`
      # failed with "no go.mod" and `project assets` silently skipped Tailwind.
      # It is a normal irgo project now, driven the way any project is.
      - run: go run ./cmd/irgo -C examples/todo project test
      # Cloudflare rather than desktop: this job exists to show the CLI can
      # drive the example, and a wasm build needs no system libraries. Linux
      # desktop needs webkit2gtk, which ubuntu-latest no longer ships — the
      # demo's matrix pins ubuntu-22.04 for that and covers it properly.
      - run: go run ./cmd/irgo -C examples/todo app build cloudflare

  showcase:
    name: Morpheus's own showcase still runs on irgo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Its own go.mod, not the repository root's. Morpheus requires Go
          # 1.26.5 and irgo requires 1.25.0 — deliberately, since demanding a
          # newer Go of every irgo user was tried once and backed out. So this
          # job installs what the showcase's module actually needs, and the
          # rest of CI keeps testing against the version irgo promises.
          go-version-file: examples/morpheus-showcase/go.mod

      # No checkout of Morpheus here, and no clone step. The showcase's pages
      # are imported rather than copied, which needs them exported, which
      # upstream does not do — they live in internal/. So this example depends
      # on a fork that moves them out, and the fork keeps upstream's `module`
      # line, which is exactly what lets go.mod replace across repositories:
      #
      #   replace github.com/romshark/morpheus => github.com/joeblew999/morpheus v0.0.0-...
      #
      # `go mod download` fetches it like any other dependency, pinned to a
      # commit. An earlier version of this job cloned the fork to a sibling
      # directory because the replace pointed at a local path — which meant CI
      # and a developer followed different instructions to reach the same code.
      # go generate first: the showcase's stylesheets and bundle are copied out
      # of the module rather than committed, so a fresh checkout has neither.
      - run: go generate ./...
        working-directory: examples/morpheus-showcase
      - run: go run ./cmd/irgo -C examples/morpheus-showcase project test
