# A tag becomes downloadable binaries.
#
# `ci.yml` proves the code works; this is what makes it obtainable by someone
# who does not have Go and should not need it in order to decide whether they
# want it.
#
# The only workflow here that uses mise. That is deliberate and not a drift
# from "CI does not need mise" — contributing still does not: `ci.yml` installs
# Go and runs `go test`, and nothing in this file runs on a pull request. What
# a release needs, and a test run does not, is a pinned copy of a tool that is
# not part of the Go toolchain. mise is where this repository pins tools, so
# this is where it is used, and the payoff is that the released binaries are
# built by the same `mise run dist:publish` a maintainer can run by hand.

name: release

on:
  push:
    tags: ["v*"]
  # Builds the matrix and uploads nothing — see the two steps below. This is
  # how the six builds and the archive names get checked without cutting a
  # tag, which is the only honest way to change a release pipeline: the
  # alternative is finding out it was broken at the point where the tag already
  # exists.
  #
  # It does not cover the release notes. Snapshot mode disables the changelog
  # pipe, so that part is rehearsed locally against an unpushed tag instead —
  # `.goreleaser.yaml` has the command under `changelog`.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the CLI binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, tags included, because the version the binary
          # reports comes from it.
          #
          # Nothing stamps the version in: `main.go` resolves it from the build
          # info, where Go records the VCS tag of a clean checkout. That is the
          # same mechanism `go install ...@v0.20.1` uses, which is why the two
          # ways of installing irgo cannot report different numbers. A shallow
          # checkout without the tag would produce `devel-<sha>` binaries, and
          # they would look fine until someone ran `irgo version`.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Installs what [tools] pins — here, goreleaser at the version this
      # commit names, not whatever is newest on the day of the release.
      #
      # The token is not optional. Every tool in [tools] comes from a GitHub
      # release, and unauthenticated API calls from Actions runners are rate
      # limited against a pool shared with every other runner — so this step
      # fails intermittently, on somebody else's traffic, without it. That is
      # an unpleasant failure anywhere and a particularly unpleasant one here,
      # where the tag already exists by the time the workflow runs.
      - uses: jdx/mise-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # There is deliberately no `mise run check` here, and the reason is the
      # step above rather than any doubt about the tests.
      #
      # mise-action puts mise's shim directory on PATH for the whole job. The
      # test suite includes TestScaffoldedProjectBuilds, which generates a
      # project and runs `irgo project assets` inside it — and that shells out
      # to templ. With shims on PATH, templ resolves to one of them:
      #
      #   Generating templ files...
      #   mise ERROR No version is set for shim: templ
      #   --- FAIL: TestScaffoldedProjectBuilds
      #
      # A templ shim exists even though nothing here pins templ, because
      # `irgo tools install` asks mise for it first (tools_mise.go) and then
      # deliberately does not run `mise use -g`, since that would rewrite the
      # developer's own config. So mise has templ installed with no version
      # *selected* — harmless until its shims are on PATH, at which point the
      # shim shadows the binary irgo resolved and cannot answer for itself.
      #
      # Nothing was wrong with the commit. The same tests pass in ci.yml on the
      # same tree; they fail here only because mise is on PATH, which is exactly
      # the separation the top of mise.toml insists on — mise carries what a
      # *contributor* uses, `irgo tools install` provisions what a *build*
      # needs, and CI does not mix them. This workflow is the one place mise is
      # installed at all, so it is the one place that invariant can break, and
      # it broke on the first rehearsal.
      #
      # Nothing is lost by removing it. These tests run three times already:
      # on the pull request, again on the push to integration, and a third time
      # on the maintainer's machine, because `wf:release` has check as a
      # dependency and cannot create the tag without it. A fourth run, in the
      # single environment configured differently from all the others, tested
      # the environment rather than the code.

      # One target and one artifact per run, chosen by what triggered it.
      # Publishing on workflow_dispatch would let a release be created from any
      # branch by anyone who can press the button; a snapshot cannot.
      - name: Build every platform, publish nothing
        if: github.event_name == 'workflow_dispatch'
        run: mise run dist

      - name: Build every platform and attach them to the release
        if: startsWith(github.ref, 'refs/tags/v')
        run: mise run dist:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # So a dispatch run has something to show for itself. Without this the
      # rehearsal proves the build succeeded but not what it produced, and the
      # filenames are the part that has to be right — `mise use -g
      # ubi:joeblew999/irgo` finds the asset by reading os and arch out of them.
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          name: irgo-snapshot
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
