# Tools for working ON irgo, as opposed to tools an irgo build needs.
#
# The distinction matters and is deliberate. `irgo tools install` provisions
# what a build requires — templ generates code, tailwind builds the stylesheet,
# gomobile builds the AAR — and every irgo app inherits that. What is here is
# what a *contributor* finds useful, and nothing an app builds depends on it.
#
# Keeping the two apart is what stops a build tool becoming workflow police:
# irgo guarantees what it needs to compile, and this file offers what the
# people working on it happen to prefer. Nobody is required to run `mise
# install` to contribute, and CI does not.
#
#   mise install     # get them
#   mise run setup   # protect main from rebases, once per clone
#   mise tasks       # every task, with what it is for
#
# The workflow itself is written down in CONTRIBUTING.md. This file is the
# executable half of it: if a task here and that document disagree, the task
# is what actually runs.
#
# Prebuilt binaries via ubi, pinned, on macOS, Linux and Windows alike. No
# Rust toolchain, no build step, nothing checked into the repository that only
# works on one machine.

[tools]
# Go is deliberately NOT pinned here.
#
# It manages its own version already: the `go` directive in go.mod is a floor,
# and the toolchain mechanism fetches what a module needs. Adding mise's Go on
# top puts a second manager on the same job, and they disagree — pinning 1.25
# while the toolchain resolved 1.26 produced
#
#   compile: version "go1.25.12" does not match go tool version "go1.26.5"
#
# on every package, from a clone that built fine a moment earlier. Nothing here
# is worth that; install Go however you like, and go.mod will say if it is too
# old.

# Stacked branch management. irgo's changes tend to arrive as a set of small
# branches that depend on each other, and moving them when their base changes
# is the tedious, error-prone part. `git-stack` renders the tree, rebases a
# whole stack onto a new base, runs a command across every branch in it, and
# pushes only the ones that are ready.
#
# Optional. Everything the workflow needs is plain git — merge, tag, branch.
# This only makes the repetitive half cheap.
# GitHub's CLI. `mise run pr` opens the pull request with it, so without this a
# new maintainer runs `mise install`, gets everything else, and then finds the
# one command they need every day is missing.
#
# mise installs the binary; it cannot log you in. `gh auth login` is a one-time
# step per machine, and `mise run pr` says so rather than failing with an API
# error about credentials.
"github:cli/cli" = "2.65.0"

"ubi:gitext-rs/git-stack" = "0.10.18"

# Cross-compiles the CLI for six platforms, archives it, and creates the
# GitHub release. `.goreleaser.yaml` is the whole configuration.
#
# This one is not optional the way git-stack is, and it is the only tool here
# that CI installs — `release.yml` runs `mise run dist:publish`, so the release
# built on a tag is built by the same command a maintainer can run on a laptop.
# Pinned for the same reason as everything else: a release is the one build
# where "whatever version was latest that day" is not an acceptable answer.
"ubi:goreleaser/goreleaser" = "2.17.1"

# Snapshots every branch pointer at once, with list/pop/apply to restore.
# A git-stack dependency, not a tool anyone runs here. It records where every
# branch pointed before a rebase; git-stack uses it as a library. The `save`
# and `restore` tasks that wrapped it are gone — they existed to park work when
# switching between two dozen branches, and work happens on the trunk now.
"ubi:gitext-rs/git-branch-stash" = "0.12.0"

# This file is the source of truth for how work happens here.
#
# Every command, and why it exists, next to the command itself — so it cannot
# drift from what actually runs. `mise tasks` lists them; the reasoning is in
# these comments. CONTRIBUTING.md carries only what is not a command: the
# branches, what is enforced, versioning, and rate.
#
# Where do I work?
#
#   mise run start feat/the-thing
#
# On a branch, one per concern — not one per idea that comes up while you are
# working on it. Everything here is meant to reach upstream eventually, and a
# branch is how a change stays offerable.
#
# When something else comes up and it is part of what you are already doing,
# stay on the branch. Eight branches were made in one afternoon for a single
# concern, each merged minutes later and reviewed by nobody; CONTRIBUTING.md
# has the list.
#
#   mise run check          exactly what CI runs      <- before every commit
#   mise run start <name>   a branch, when work needs to be separable
#   mise run ship           push a branch
#
# Those three cover a normal day. Everything below them is for the occasional
# job — releasing, or moving your work when main has moved — and you can ignore
# it until you need it.
#
#   mise run offer <name>   start a branch to send upstream, cut from main
#
# setup copies this file to mise.local.toml, which is gitignored. Branches cut
# from main do not carry mise.toml — main mirrors upstream, which has not taken
# it yet — so without the copy the tasks vanish the moment you start work. The
# local copy is untracked, so it survives every branch switch.
#
# setup also points upstream's push URL at nothing, so `git push upstream`
# fails instead of landing commits in someone else's repository. Fetching still
# works — it is only pushing that is stopped. Offering a change upstream is a
# pull request from this fork, which that does not prevent and should not.
#   mise run where          which branch am I on, and what else exists
#   mise run save           snapshot every branch, before anything risky
#   mise run restore        put them all back
#   mise run rebase         move your branches onto an updated main
#   mise run merge          put the branch you are on onto the trunk
#   mise run tag <version>  name a release
#   mise run publish        push the trunk and its tags
#
# Releasing is one command, from the trunk, once the change has landed:
#
#   mise run wf:release v0.20.1
#
# It runs check, tags, and pushes the tag; `release.yml` then cross-compiles
# the CLI for six platforms and attaches the archives to a draft release. That
# is what makes irgo obtainable by someone who does not already have Go — which
# it was not, for the whole of this fork's life, and which matters more here
# than for most projects because `go install` cannot fetch this CLI at all:
# the module keeps upstream's path, so the fork is reachable only as a binary
# or a clone. `.goreleaser.yaml` has the detail.
#
#   mise run dist    build all six locally, upload nothing  <- after editing that file
#
# Each task is a single invocation of a real tool: no shell pipelines, no &&
# chains, nothing that behaves differently on Windows.

[tasks."wf:branch"]
# Start a piece of work. With more than one maintainer, everything reaches the
# trunk through a pull request — so `integration` is never a branch anyone
# commits to directly, and CI has run before a change lands rather than after.
#
# Two steps on purpose: switch to the trunk, then branch from where you now
# are. `git switch --create` alone branches from whatever you had checked out,
# which is usually your last piece of work, and carries all of it along.
#
# These are short-lived: hours or days, one per change, deleted by GitHub when
# the pull request merges. That is the opposite of the twenty-four long-lived
# ones that made this repository unworkable — those were workspaces you had to
# switch between to edit a file. A branch that exists for an afternoon is not
# the same animal.
description = "Start a change, on a branch off the trunk"
run = ["git switch integration", "git pull --quiet --ff-only", "git switch --create"]

[tasks."wf:pr"]
# Push and open the pull request in one step, so the loop has no gap where a
# branch sits pushed and unreviewed.
#
# No --repo, and that is what makes this file portable.
#
# It used to say `--repo joeblew999/irgo`, because a clone with an upstream
# remote has gh resolving there by default: without it the pull request was
# aimed at stukennedy/irgo, where integration does not exist, and failed with a
# git error about separating paths from revisions that named nothing real.
#
# But a fork copying this file then drove *this* repository rather than its
# own, which is the opposite of what a shared workflow is for. `wf:setup` now
# runs `gh repo set-default`, which records the answer in .git/config — per
# clone, where fork-specific facts belong, rather than in a tracked file where
# only one fork's answer can ever be right.
description = "Push the branch you are on and open its pull request"
run = "gh auth status >/dev/null 2>&1 || { echo 'Not logged in to GitHub. Run: gh auth login'; exit 1; }\ngit push --set-upstream origin HEAD\ngh pr create --base integration --fill"

[tasks."wf:land"]
# The other half of `pr`. Without this the loop stops at "opened", and everyone
# finishes by hand in the web interface or with raw gh commands — which is how
# the workflow ends up being something people describe rather than run.
#
# The branch is still named explicitly. gh will infer it, but naming it costs
# nothing and says plainly which pull request is being armed.
#
# --auto rather than waiting in a shell: GitHub merges it the moment the checks
# pass, so a slow Windows runner does not hold a terminal open. The branch is
# deleted with it.
#
# It cannot merge a red pull request even with this — the trunk requires all
# five checks, for everyone including whoever owns the repository.
#
# The update-branch line is the half that was missing, and it cost an afternoon
# to notice. integration requires branches to be up to date, and enabling
# auto-merge does *not* refresh one that has fallen behind — so the moment any
# other pull request lands, this one sits at BLOCKED with every check green and
# waits for a human who has already moved on. It happened three times in a row
# before the pattern was visible.
#
# Failure is tolerated because "already up to date" is the normal case, and is
# not a problem worth stopping for.
#
# This closes the common case, not every case: a pull request that goes stale
# *after* this runs still needs refreshing, and nothing local can do that.
# Turning on "Always suggest updating pull request branches" in the repository
# settings is the other half, and it is a setting rather than a command.
description = "Merge the pull request for this branch once CI passes, and clean up"
run = "gh auth status >/dev/null 2>&1 || { echo 'Not logged in to GitHub. Run: gh auth login'; exit 1; }\ngh pr update-branch \"$(git branch --show-current)\" || echo 'branch already up to date with the trunk'\ngh pr merge \"$(git branch --show-current)\" --squash --delete-branch --auto\ngit switch integration\ngit pull --quiet --ff-only"

[tasks."wf:status"]
# What is happening to the pull request you just opened, without leaving the
# terminal or guessing how long Windows takes.
description = "Show the checks on this branch's pull request"
run = "gh pr checks \"$(git branch --show-current)\""

[tasks."wf:offer"]
# The rare thing, made explicit.
#
# Cut from upstream/main, the remote-tracking ref, rather than a local mirror of
# it. A branch called main that only ever copied somebody else's was one more
# thing to explain to every maintainer and one more thing to keep in sync.
#
# Work happens on integration. This is for the moment somebody decides a
# specific change should go upstream — it cuts from main, which mirrors
# upstream, and replays only the commits you name. The result carries that
# change and nothing else, which is what a reviewer needs and what the old
# stacked branches had stopped being: the last one built here carried nineteen
# commits.
#
# If a cherry-pick conflicts, the change depends on something only the fork has.
# That is information, not a failure — it means the change was never offerable,
# and no amount of branching earlier would have made it so.
#
# Opening the pull request is still a separate, deliberate act, and still needs
# the repository owner's agreement. Seven were once opened without it and all
# seven were withdrawn.
#
#   mise run offer fix/some-bug <sha>...
description = "Cut a pull-request branch from main with only the commits you name"
usage = """
arg "<branch>" help="name for the pull-request branch"
arg "<commits>" var=#true help="the commits to replay onto it"
"""
run = "git fetch --quiet upstream && git switch --detach upstream/main && git switch --create \"$usage_branch\" && git cherry-pick $usage_commits && git push --set-upstream origin HEAD"

# check and verify are deliberately not namespaced. They are about the code —
# does it compile, do the tests pass, does every target still build — and you
# run them constantly. Everything under wf: is about moving work around: making
# a branch, opening a pull request, landing it, tagging a release. That is a
# different job, it is not part of the irgo CLI, and the prefix keeps the two
# from being read as one set.
[tasks.check]
# Everything CI runs, in the order it runs it, so passing here means passing
# there. It used to be `go test ./...` alone, which let formatting and vet
# failures through — and a check that does not predict CI teaches people to
# push and wait instead of running it.
#
# Formatting is asserted by a test rather than a step here, because turning
# `gofmt -l` into a failure needs a shell pipeline, and shell pipelines are
# what stopped this working on Windows the last three times.
description = "Everything CI runs: vet, tests, and the wasm build"
run = ["go vet ./...", "go test ./...", "GOOS=js GOARCH=wasm go build ./..."]

[tasks.verify]
# What `check` cannot tell you: whether this still builds for every target.
#
# `check` is vet, test and the wasm build — seconds, and it never compiles a
# native target. This does, through the CLI, on the machine that has the
# toolchains warm. From a Mac that is everything except the Linux desktop:
# Windows cross-compiles via mingw-w64, which irgo installs itself.
#
# `tools doctor` runs first so a skip is visible. `app build all` deliberately
# skips what the host cannot do, and a silent skip reading as a pass is exactly
# how a broken target ships.
#
# Slow on a cold machine: the Android build downloads the SDK and NDK.
description = "Build every target this host can, after check"
depends = ["check"]
run = [
  "go run ./cmd/irgo tools doctor",
  "go run ./cmd/irgo app build all",
  "go run ./cmd/irgo app build web",
  "go run ./cmd/irgo app build cloudflare",
]

[tasks.dist]
# The release build, without the release.
#
# Trying irgo used to start with installing Go, because the CLI was only ever
# distributed as source. That is a real barrier for the thing whose whole
# pitch is that it provisions your toolchain for you — the first instruction
# contradicted the second.
#
# `check` and `verify` ask whether the code works. This asks whether it still
# *ships*: six platforms, archived, checksummed, exactly as a tag would produce
# them, into `dist/`. Nothing is uploaded and no tag is needed.
#
# Run it after touching `.goreleaser.yaml`. Otherwise that file is only ever
# exercised on the day a release is being cut, which is the worst possible day
# to discover it was wrong — and the failure arrives after the tag exists,
# which is the one thing that is awkward to take back.
#
# Seconds, not minutes: the CLI is pure Go, so all six cross-compile on any
# host with no toolchain beyond Go itself.
description = "Build the release binaries for every platform, into dist/ — uploads nothing"
run = "goreleaser release --snapshot --clean --skip=publish"

[tasks."dist:publish"]
# What `release.yml` runs when a tag is pushed. Listed here rather than written
# into the workflow so that the released binaries are built by a command that
# can be read, and if necessary run, from a laptop.
#
# Not something to run by hand: it needs GITHUB_TOKEN and it creates a release.
# `mise run wf:release v0.20.1` is the human end of this — it tags, and CI
# arrives here on its own.
description = "Build and upload a release — CI runs this on a tag; use wf:release instead"
run = "goreleaser release --clean"

[tasks."wf:ship"]
description = "Push the branch you are on"
run = "git push --set-upstream origin HEAD"

[tasks."wf:where"]
description = "Which branch you are on, and what else exists"
run = "git-stack"



[tasks."wf:rebase"]
description = "Move your branches onto an updated main"
run = "git-stack --pull"

[tasks."wf:merge"]
# Switches to integration, merges the branch you were on, then steps back off.
#
# Standing on integration is how the next commit lands there, and a commit on
# integration exists nowhere else — it cannot be offered upstream without being
# re-cut by hand. Sixteen were orphaned that way in one afternoon.
#
# If one slips through anyway, `mise run where` shows it: git-stack marks a
# local commit on a protected branch, so it is visible on your machine rather
# than only in CI.
description = "Merge the branch you are on into integration, then step off it"
run = ["git switch integration", "git merge --no-edit -", "git switch -"]

[tasks."wf:done"]
# Ending a branch, which the workflow had no way to do.
#
# Twenty-four accumulated because there was a command to start one and none to
# finish. Every one was merged; none was ever retired.
#
# The safety is git's own: `branch -d` — lowercase — refuses to delete anything
# not merged into the branch you are standing on, and this stands on
# integration first. Deliberately not `-D`; a refusal here means the work is
# not yet anywhere else, which is exactly when you want to be stopped.
#
# Nothing is lost by retiring a merged branch. `merge` above makes a real merge
# commit, so the tip stays addressable forever as <merge>^2 and reachable from
# integration — a branch can be recreated from it byte-for-byte.
#
# The remote delete is allowed to fail, and that is the whole point of the
# rewrite. `wf:land` merges with --delete-branch, so by the time you retire a
# branch GitHub has usually removed it already, and asking again gets
#
#   error: unable to delete 'x': remote ref does not exist
#
# which is a non-zero exit on precisely the branches this task exists to clean
# up. Six had piled up locally, every one merged, every one refusing to retire
# in a way that looked like the task was broken rather than the work being
# finished. The local delete had actually succeeded each time — the error came
# after it — so the reflex to stop and investigate was earned but wrong.
#
# A branch that never had a pull request still has a remote to remove, so the
# push stays. It just no longer treats "already gone" as a failure.
description = "Retire a merged branch, locally and on origin"
usage = 'arg "<branch>" help="the merged branch to retire"'
run = [
  "git switch integration",
  "git branch -d \"$usage_branch\"",
  "git push --quiet origin --delete \"$usage_branch\" || echo 'remote branch already gone — GitHub deletes it when the pull request merges'",
]

[tasks."wf:preview"]
# Running everything that is in flight, at once.
#
# Branches are how work stays separable, and the cost of that is nobody ever
# sees the combination until it is already the trunk. Each one passes CI
# against integration on its own; what none of them tells you is whether the
# app still works with all of them in it. That question had no command, so it
# had no answer.
#
#   mise run wf:preview docs/china fix/datastar fix/scaffolding
#   cd ../irgo-preview && go run ./cmd/irgo app run desktop
#
# A worktree rather than a branch, for three reasons. Your own checkout does
# not move, so this is not something you have to undo before carrying on.
# The worktree is detached, so there is no branch here to accidentally push.
# And it is a real directory, so the combined tree can actually be built and
# run rather than merely merged and inspected.
#
# A sibling of the repository, not a directory inside it, and that is not a
# matter of taste. go.work here says `use ( . )`, and a worktree below the root
# still finds that file by walking up — so `.` resolves to the checkout you
# came from and the preview is in no module at all:
#
#   pattern ./...: directory prefix . does not contain modules listed in
#   go.work or their selected dependencies
#
# Every go command inside it fails that way, which defeats the entire purpose:
# the point of a worktree over a branch was being able to build and run the
# combination. Outside the root it carries its own merged go.work and behaves
# like any other checkout.
#
# One `git merge` with several branches after it is an octopus merge: one
# commit, all of them, in a single invocation. It refuses the whole thing if
# any pair conflicts, which is the honest answer — a preview assembled by
# resolving conflicts is a preview of something nobody has.
#
# Throw it away with `wf:preview:drop`. Nothing depends on it.
description = "Merge the branches you name into a throwaway worktree, to run them together"
usage = 'arg "<branches>" var=#true help="the branches to combine"'
run = [
  "git worktree remove --force ../irgo-preview || true",
  "git worktree add --detach ../irgo-preview integration",
  "git -C ../irgo-preview merge --no-edit $usage_branches",
]

[tasks."wf:preview:drop"]
description = "Delete the preview worktree"
run = "git worktree remove --force ../irgo-preview"

[tasks."wf:tag"]
# Creating and pushing are separate because the version is an argument and it
# has to land on the tag command, not on a push. Check before you tag: a tag is
# the one thing that is awkward to take back.
description = "Name a release — give it a version, e.g. v0.6.5"
run = "git tag --annotate --message=release"

[tasks."wf:publish"]
description = "Push the trunk and every tag on it"
run = "git push --follow-tags origin integration"

[tasks."wf:release"]
# Cutting a release, in one command, from the trunk.
#
# `check` first and as a dependency rather than a step, so the tag cannot be
# created by a run where the tests failed — a tag is the one thing here that is
# awkward to take back, and the binaries CI builds from it are the artifact
# strangers download.
#
# Only the tag is pushed, not the branch. `wf:publish` pushes integration with
# its tags, which is right when the trunk has moved; here it has not — the
# commit being tagged is already on origin, having arrived through a pull
# request. Pushing just the tag is the smaller act and the one that triggers
# `release.yml`.
#
# What CI then does is `dist:publish`: six platforms, archived and checksummed,
# attached to a **draft** release. Drafts are deliberate — the tag says which
# commit, and a person still says what it is for. Publish it from the releases
# page when the notes read the way you want.
#
#   mise run wf:release v0.20.1
#
# Plain semver, ahead of upstream, no prerelease suffix; CONTRIBUTING.md says
# why the hyphenated tags this repository used to cut were actively harmful.
description = "Tag a release and let CI build the binaries — e.g. v0.20.1"
usage = 'arg "<version>" help="the release version, e.g. v0.20.1"'
depends = ["check"]
run = [
  "git tag --annotate --message=release \"$usage_version\"",
  "git push origin \"$usage_version\"",
]

[tasks."wf:setup"]
# Both, not just main. integration is this fork's trunk and is built by
# merging; letting a rebase tool rewrite it would replace that history with a
# replayed copy. A task that ran `git-stack --pull --stack all` here tried
# exactly that and was only stopped by a conflict.
# set-default is what lets every other task drop `--repo`.
#
# gh resolves to the upstream remote when a clone has one, so `wf:pr` and
# `wf:land` used to name joeblew999/irgo outright. That worked here and only
# here: a second fork copying this file got tasks that opened pull requests
# into somebody else's repository, and `wf:land` — which finds a pull request
# by branch name — would have armed auto-merge on whatever this repository had
# under the same name.
#
# Derived from the clone's own origin rather than written down, and stored in
# .git/config, which is per clone and untracked. That is where a fact that
# differs per fork belongs; a tracked file can only ever hold one fork's answer.
# The same mise.toml now drives every fork, and upstream, unchanged.
description = "Protect main, point gh at this fork, stop pushes to upstream — once per clone"
run = [
  "git-stack --protect integration",
  "git remote set-url --push upstream DO-NOT-PUSH-TO-UPSTREAM",
  "gh repo set-default \"$(git remote get-url origin)\"",
  "cp mise.toml mise.local.toml",
]
