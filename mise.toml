# Tools for working ON irgo, as opposed to tools an irgo build needs.
#
# The distinction matters and is deliberate. `irgo tools install` provisions
# what a build requires — templ generates code, tailwind builds the stylesheet,
# gomobile builds the AAR — and every irgo app inherits that. What is here is
# what a *contributor* finds useful, and nothing an app builds depends on it.
#
# Keeping the two apart is what stops a build tool becoming workflow police:
# irgo guarantees what it needs to compile, and this file offers what the
# people working on it happen to prefer. Nobody is required to run `mise
# install` to contribute, and CI does not.
#
#   mise install     # get them
#   mise ls          # see what you have
#
# Prebuilt binaries via ubi, pinned, on macOS, Linux and Windows alike. No
# Rust toolchain, no build step, nothing checked into the repository that only
# works on one machine.

[tools]
# Stacked branch management. irgo's changes tend to arrive as a set of small
# branches that depend on each other, and moving them when their base changes
# is the tedious, error-prone part. `git-stack` renders the tree, rebases a
# whole stack onto a new base, runs a command across every branch in it, and
# pushes only the ones that are ready.
#
# Optional. Everything the workflow needs is plain git — merge, tag, branch.
# This only makes the repetitive half cheap.
"ubi:gitext-rs/git-stack" = "0.10.18"

# Snapshots every branch pointer at once, with list/pop/apply to restore.
# The safety net before rebasing a stack: `git stash` saves uncommitted work,
# this saves where all your branches were pointing. git-stack uses it as a
# library but exposes no restore command, so it is worth having on its own.
"ubi:gitext-rs/git-branch-stash" = "0.12.0"

# The workflow, as commands rather than as a document nobody reads.
#
# `mise tasks` lists them. Each is a single invocation of a real tool — no
# shell pipelines, no && chains, nothing that behaves differently on Windows.
# That is deliberate: an earlier attempt at this was a shell script called from
# a git hook, which worked on one machine and nowhere else.
#
# These do not prevent you doing the wrong thing by hand. What they do is make
# the right thing the shortest thing to type, and put the reasoning next to the
# command instead of in a wiki. The one invariant that actually matters — that
# this fork's main never diverges from upstream — is enforced by CI, because
# that is the only place enforcement works for everyone.

[tasks.setup]
description = "Protect main from rebases, once per clone"
run = "git-stack --protect main"

[tasks.stack]
description = "Show your branches and what they sit on"
run = "git-stack"

[tasks.snapshot]
description = "Save where every branch points, before anything risky"
run = "git-branch-stash push"

[tasks.undo]
description = "Put every branch back where the last snapshot had it"
run = "git-branch-stash pop"

[tasks.sync]
description = "Rebase your branches onto the updated parent"
run = "git-stack --pull"

[tasks.verify]
description = "Build and test every branch in the stack, not just this one"
run = "git-stack run go test ./..."

[tasks.integrate]
description = "Rebuild the integration branch from every ready branch"
run = "git-stack --pull --stack all"

[tasks.pr]
description = "Start a branch for a pull request, cut from main so it carries only its own change"
run = "git switch --create"
